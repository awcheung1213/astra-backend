services:
 evergreen-backend:
   build: .
   container_name: evergreen-backend
   command: >
     sh -c "
      until pg_isready -h evergreen-backend-database -p 5432 -U postgres; do
        echo 'Waiting for Postgres...';
        sleep 2;
      done;
      alembic upgrade head;
      procrastinate --app=worker.app.app schema --apply;
      uvicorn main:app --reload --host 0.0.0.0 --port 8000
      "
   ports:
     - "8000:8000"
   volumes:
     - $HOME:/root
     - .:/app
   env_file:
     - .env
   environment:
     - PYTHONPATH=/app
   depends_on:
     - evergreen-backend-database
   stdin_open: true
   tty: true
   networks:
     - default


 evergreen-backend-worker:
   build: .
   container_name: evergreen-backend-worker
   command: >
     sh -c "
      until pg_isready -h evergreen-backend-database -p 5432 -U postgres; do
        echo 'Waiting for Postgres...';
        sleep 2;
      done;
      python -m worker.run
      "
   volumes:
     - $HOME:/root
     - .:/app
   env_file:
     - .env
   environment:
     - PYTHONPATH=/app
   depends_on:
     - evergreen-backend-database
     - evergreen-backend
   stdin_open: true
   tty: true
   networks:
     - default


 evergreen-backend-database:
   image: postgres:16-alpine
   container_name: evergreen-backend-database
   volumes:
     - evergreen-backend_database_data:/var/lib/postgresql/data
   environment:
     - POSTGRES_DB=postgres
     - POSTGRES_USER=postgres
     - POSTGRES_PASSWORD=postgres
   ports:
     - "5432:5432"

volumes:
 evergreen-backend_database_data:
